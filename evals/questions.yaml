# The answer key for the OCPP 1.6 RAG system.
#
# WHAT IS STORED HERE AND WHAT IS NOT
#
# Only QUESTIONS and the SECTION NUMBERS an answer should come from. Never the
# specification's answer text. The OCPP specifications are copyright Open
# Charge Alliance; this repository is public, and the PDFs are gitignored. A
# section number is a pointer, not a reproduction.
#
# WHY A FILE AND NOT A DATABASE TABLE
#
# On Day 16 a single wrong label flipped the entire conclusion about distance
# thresholds. An answer key needs more review than the code it tests, so it
# lives in a diff where a changed label is visible, with its justification
# beside it.
#
# EVERY ENTRY CARRIES ITS REASON
#
# `why` is not documentation. It is the thing that caught the Day 16 bug: a
# label you cannot justify in one sentence is a label you cannot trust.

version: 1

# WHY THE DOCUMENT NAME IS PART OF THE ANSWER KEY
#
# Section numbers are NOT unique across the corpus. "3.7" exists in four of
# the five PDFs: it is "Transaction-related messages" in the core spec, "From"
# (an XML header field) in the SOAP spec, and a typo correction in each errata
# sheet. Scoring on the section number alone would count a hit on the wrong
# document — and it would push the score UP, so it would read as an
# improvement. Every question therefore names the document it is about.
default_source: ocpp-1.6-edition-2.pdf

# ── kinds, and why the distinction is not cosmetic ──────────────────────────
#
#   lookup         one section answers it. The easy case.
#   cross-section  the answer needs two or more sections together.
#   false-premise  the question assumes a rule the spec does not impose. A
#                  correct answer contradicts the question.
#   unanswerable   not in this document. A correct answer refuses.
#   ambiguous      the corpus mentions it without specifying it. RUN and
#                  REPORTED, but excluded from the headline score, because
#                  grading it honestly is not possible. Pretending otherwise
#                  is how a test set starts lying to you.

questions:

  # ── lookup ────────────────────────────────────────────────────────────────

  - id: heartbeat-interval
    q: what is the heartbeat interval?
    kind: lookup
    expect: ["9.1.10"]
    why: HeartbeatInterval is a configuration key; 9.1.10 defines it.

  - id: remote-stop-transaction
    q: how does RemoteStopTransaction work?
    kind: lookup
    expect: ["5.12"]
    why: 5.12 is the Remote Stop Transaction operation.

  - id: chargepoint-errorcode-values
    q: what are the valid values for ChargePointErrorCode?
    kind: lookup
    expect: ["7.6"]
    why: 7.6 is the ChargePointErrorCode enumeration itself.

  - id: metervalues-contents
    q: what is in a MeterValues message?
    kind: lookup
    expect: ["6.31"]
    why: 6.31 is the MeterValues.req field definition.

  # ── cross-section ─────────────────────────────────────────────────────────

  - id: transactional-events
    q: what are transactional events?
    kind: cross-section
    expect: ["3.7", "4.1", "4.8", "4.7", "4.10"]
    why: >
      A complete answer has to walk the whole charging session, not just the
      overview: 3.7 Transaction-related messages, then 4.1 Authorize, 4.8
      Start Transaction, 4.7 Meter Values, 4.10 Stop Transaction. Originally
      labelled with 3.7 alone, which made a partial answer look complete.
      The word "events" never appears in OCPP 1.6, which is why this scores
      badly on keyword search while being perfectly answerable. Before that it
      was mislabelled unanswerable, assuming 2.0.1's TransactionEvent message;
      that one wrong label collapsed the measured threshold gap from 0.15 to
      0.022 and flipped the day's conclusion. Two wrong labels on one
      question, both caught by having to justify it in writing.

  # ── false premise ─────────────────────────────────────────────────────────

  - id: status-notification-must
    q: when must a charge point send StatusNotification?
    kind: false-premise
    expect: ["4.9"]
    why: >
      The premise is wrong. OCPP 1.6 says a Charge Point MAY send a
      StatusNotification on a status transition; the only MUST in 4.9 concerns
      message ORDERING. A correct answer says there is no such obligation. An
      answer that quotes the ordering MUST is accurate and still leaves the
      reader believing the opposite of the truth.

  # Four shapes of false premise, two questions each. Every one was verified
  # against the corpus before being labelled — the refuting sentence is quoted
  # in the `why`, because a premise I only BELIEVE is wrong is exactly what
  # this eval exists to test. The author of the key must not also be its
  # examiner.

  # shape: a MUST that is really a MAY
  - id: meter-values-timing-must
    q: when must a charge point send a MeterValues message during a transaction?
    kind: false-premise
    expect: ["4.7", "9.1.19"]
    why: >
      4.7 settles it in one sentence: "It is up to the Charge Point to decide
      when it will send meter values." There is no obligation to contradict —
      9.1.19 MeterValueSampleInterval is a configuration key, and a value of 0
      means no sampled data is sent at all. A correct answer says the timing is
      configured, not mandated. The dangerous answer quotes the SHALL in 4.7
      ("SHALL send a MeterValues.req PDU for offloading meter values"), which
      is about the message FORMAT once you send one, not about when.

  # shape: a MUST that is really a MAY
  - id: connector-unlock-must
    q: when must a charge point unlock the connector after the cable is unplugged at the EV?
    kind: false-premise
    expect: ["4.10", "9.1.33", "9.1.23"]
    why: >
      Unlocking is governed by two configuration keys, not by a rule: 9.1.33
      UnlockConnectorOnEVSideDisconnect and 9.1.23
      StopTransactionOnEVSideDisconnect. 4.10 states the precedence — when
      StopTransactionOnEVSideDisconnect is false "cables always remain
      locked". So the honest answer is "it depends on two keys", and it must
      name both, because answering with only one of them is how a field
      engineer ends up debugging a cable that will not release.

  # shape: a field assumed required that is optional
  - id: status-notification-timestamp-required
    q: why is the timestamp field required in a StatusNotification.req?
    kind: false-premise
    expect: ["6.47"]
    why: >
      6.47 lists timestamp as 0..1 Optional, with "If absent time of receipt
      of the message will be assumed." Only connectorId, errorCode and status
      are 1..1 Required. The question invents a requirement. This one is
      deliberately close to a real lookup — the correct section IS retrieved,
      and the whole test is whether the model reads the cardinality column
      instead of agreeing with the question.

  # shape: a field assumed required that is optional
  - id: stop-transaction-meter-data-required
    q: why must a StopTransaction.req carry the meter values collected during the transaction?
    kind: false-premise
    expect: ["6.49", "4.10"]
    why: >
      transactionData is 0..* Optional in 6.49, and 4.10 calls it "an optional
      TransactionData element". meterStop IS required, which is the trap: the
      passage contains a required meter field and an optional meter-value
      list, so an inattentive answer can confirm the premise using the wrong
      row of the same table.

  # shape: a default the specification never states
  - id: default-heartbeat-interval
    q: what is the default heartbeat interval in OCPP 1.6?
    kind: false-premise
    expect: ["9.1.10", "4.6"]
    why: >
      9.1.10 HeartbeatInterval defines the key — required, RW, integer,
      seconds — and states no value. 4.6 says only "after a configurable time
      interval". The premise assumes the specification picked a number. That
      it did not is a deliberate choice, not an omission: 9.1.17
      MeterValuesSampledData DOES carry an explicit Default, which proves the
      document states a default when it intends one.

  # shape: a default the specification never states
  - id: default-connection-timeout
    q: what is the default connection timeout value in OCPP 1.6?
    kind: false-premise
    expect: ["9.1.6"]
    why: >
      9.1.6 ConnectionTimeOut defines the interval from status 'Preparing'
      until an incipient transaction is cancelled, and gives no value. Also a
      word-sense test: "connection timeout" sounds like a network setting, so
      a wrong answer may reach for WebSocket ping timing in the JSON transport
      spec, which is a different document and a different concept.

  # shape: a capability assumed on the wrong side of the protocol
  - id: csms-start-charging-without-transaction
    q: how does the Central System make a charge point deliver energy without starting a transaction?
    kind: false-premise
    expect: ["5.11", "6.33"]
    why: >
      There is no such operation. 5.11 Remote Start Transaction is the closest
      thing and it starts a TRANSACTION — and even then its effect depends on
      9.1.3 AuthorizeRemoteTxRequests, so the charge point may still authorize
      first. Energy delivery outside a transaction is not something OCPP 1.6
      exposes. Asked because CPO roadmaps request it regularly.

  # shape: a capability assumed on the wrong side of the protocol
  - id: csms-read-meter-on-demand
    q: how does the Central System read a charge point's current meter reading directly?
    kind: false-premise
    expect: ["5.17", "6.51", "7.32"]
    why: >
      It cannot read anything. OCPP 1.6 has no request/response that returns a
      meter value; the charge point reports. The nearest mechanism is 5.17
      Trigger Message — 6.51 TriggerMessage.req with requestedMessage set to
      MeterValues from the 7.32 MessageTrigger enumeration — which ASKS the
      charge point to send a MeterValues.req, and 7.44 TriggerMessageStatus
      allows it to be rejected. The premise treats the charger as a REST API.

  # ── unanswerable: a refusal is the correct answer ─────────────────────────

  - id: set-variables
    q: how does SetVariables work?
    kind: unanswerable
    expect: []
    why: >
      SetVariables is an OCPP 2.0.1 message; 1.6 uses ChangeConfiguration.
      verified: 0 chunks in the corpus contain "setvariables".

  - id: boot-reason
    q: what is a BootReason?
    kind: unanswerable
    expect: []
    why: >
      BootReason is an OCPP 2.0.1 field.
      verified: 0 chunks in the corpus contain "bootreason".

  # ── ambiguous: reported, not scored ───────────────────────────────────────

  - id: iso15118-plug-and-charge
    q: how does ISO 15118 plug and charge work?
    kind: ambiguous
    expect: []
    why: >
      "15118" appears in 2 chunks, so OCPP 1.6 mentions the standard without
      specifying it. Partially answerable. Previously excluded from the set
      entirely because it fitted neither bucket — which lost the information.
      Kept here, run, reported, and left out of the score.

  # ── from the domain expert, not from the table of contents ────────────────
  #
  # These six came from someone who has worked on charge points for fifteen
  # years, and not one of them could have been generated from section titles.
  # They ask about sequence, failure, and operational intent — none of which
  # a heading announces.

  - id: charging-session-event-sequence
    q: what is the sequence of OCPP events during a charging session?
    kind: cross-section
    expect: ["3.7", "4.1", "4.8", "4.7", "4.10", "4.9"]
    why: >
      Needs the whole session: 4.1 Authorize, 4.8 Start Transaction, 4.7
      Meter Values, 4.10 Stop Transaction, 4.9 Status Notification, plus the
      3.7 overview. Harder than `transactional-events` because it asks for
      the ORDER, and no single passage states the order — it has to be
      assembled from six sections. Closely related to that question, so the
      two will tend to pass or fail together; kept because "what are they"
      and "in what order" are different failures.

  - id: offline-before-session-start
    q: what happens if the server connection is broken before a session starts?
    kind: cross-section
    expect: ["3.5", "3.5.4", "4.2.1", "9.1.12", "9.1.1"]
    why: >
      Offline authorisation behaviour: 3.5 Local Authorization & Offline
      Behavior, 3.5.4 Unknown Offline Authorization, 4.2.1 Transactions
      before being accepted by a Central System, and the two configuration
      keys that govern it, 9.1.12 LocalAuthorizeOffline and 9.1.1
      AllowOfflineTxForUnknownId. A question about a FAILURE MODE, which no
      section heading advertises.

  - id: set-charging-profile-snake-case
    q: how does set_charging_profile event work?
    kind: cross-section
    expect: ["5.16", "6.43"]
    why: >
      5.16 Set Charging Profile is the operation, 6.43 SetChargingProfile.req
      the message. The SPELLING IS KEPT AS ASKED — snake_case, and "event"
      rather than "operation". OCPP writes SetChargingProfile, and our
      identifier-aware retrieval only fires on CamelCase, so this tests
      whether a wrongly-spelled identifier still reaches the right section.
      Real users type it this way; normalising the question would remove the
      test.

  - id: messages-carrying-timestamp
    q: which OCPP messages carry a timestamp?
    kind: cross-section
    expect: ["3.15", "6.45", "6.47", "6.49", "7.33", "6.30"]
    why: >
      Verified by searching the corpus for a dateTime field: StartTransaction.req,
      StatusNotification.req, StopTransaction.req, MeterValue, Heartbeat.conf,
      and 3.15 Time notations for the format. JUDGEMENT CALL, PLEASE CHECK:
      GetDiagnostics.req, UpdateFirmware.req, ReserveNow.req and IdTagInfo
      also carry dateTime fields, but those are scheduling dates and expiry
      dates rather than event timestamps, so they are excluded. If the
      intended reading was "every dateTime field", add them.

  - id: csms-initiated-operations
    q: which CSMS-initiated operations does a charge point acknowledge and respond to?
    kind: ambiguous
    expect: []
    why: >
      A human answers this from the table of contents: chapter 5 is titled
      "Operations Initiated by Central System" and its subsections are the
      list. But NO PASSAGE CONTAINS THAT LIST. 3.3 Feature Profiles groups
      messages by profile, not by direction, and chapter 5 has no preamble
      enumerating its operations. So the answer lives in the document's
      STRUCTURE, which a chunk-based retriever cannot see — it only ever
      holds pieces of text. Kept as a documented structural limit of RAG:
      reported, not scored. A table-of-contents index would fix it, which is
      a design note for later.

  - id: suspend-and-re-enable-charger
    q: how can a charger be suspended so it allows no further sessions, and how is it enabled again?
    kind: cross-section
    expect: ["5.2", "6.7", "7.4", "7.3"]
    why: >
      5.2 Change Availability is the operation, 6.7 ChangeAvailability.req
      the message, 7.4 AvailabilityType the Inoperative/Operative values and
      7.3 AvailabilityStatus the response. An OPERATIONAL question — "how do
      I achieve this outcome" rather than "what does this section say" — and
      the answer requires knowing that availability is the mechanism, which
      the question never names.

  # ── title-derived lookups ─────────────────────────────────────────────────
  #
  # Generated by scripts/propose_questions.py from the specification's table
  # of contents, then reviewed by hand. 50 drafted, 43 kept. Seven were
  # deleted for one reason: their answer is contained in the subject they
  # name. "What does SendLocalListMaxLength control?" is answerable by
  # splitting the identifier, with no retrieval at all — it would pass even
  # if the index were empty, so it measures nothing while still adding a
  # point to the score. A question that cannot fail is not a test.
  #
  # What this group IS good for: it is large, mechanical and unbiased by what
  # I know about the system. What it is NOT good for: it is almost entirely
  # the easy shape, and its phrasing is copied off the answer sheet. Read the
  # per-kind numbers, never the single headline average — 43 easy questions
  # will drown the 6 hard ones that actually found the failure modes.

  - id: feature-profiles
    q: what does OCPP 1.6 say about Feature Profiles?
    kind: lookup
    expect: ["3.3"]
    why: >
      Title-derived. The expected section is the one whose heading
      produced this question, so the mapping is correct by
      construction, not by judgement. Reviewed only for whether it is
      a question a person would ask. The WORDING comes from the
      specification's own table of contents, which is this whole
      group's weakness: it uses the document's vocabulary, not an
      operator's, and so cannot surface the vocabulary gap that the
