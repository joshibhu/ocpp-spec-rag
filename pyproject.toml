[project]
name = "ocpp-spec-rag"
version = "0.1.0"
description = "Grounded question answering over the OCPP 1.6 specification"
readme = "README.md"
authors = [
    { name = "Bhuwan Joshi", email = "bhuwanjoshi.it@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.22.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
]


[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The project is "ocpp-spec-rag" but the import is "specrag". uv_build would
# otherwise look for src/ocpp_spec_rag/ — unlike Maven, it derives the module
# name from the project name unless told not to.
module-name = "specrag"
